name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff2d95&color_dots=#161b22,#3b0a45,#6a0f7a,#a020c8,#e040fb

      - name: Speed up snake animation
        run: |
          python3 - <<'EOF'
          import re, glob
          SPEED = 1.5  # 1.5 = 50% faster, 2 = twice as fast
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              s = re.sub(r'(?<![\w.#-])(\d+)ms',
                         lambda m: str(max(1, int(int(m.group(1)) / SPEED))) + 'ms', s)
              open(f, "w").write(s)
          EOF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
